name: Portfolio to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. VALIDATION JOB (Runs on PRs and Pushes)
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Validate HTML Structure
        run: |
          echo "🔍 Checking if index.html exists..."
          test -f src/index.html || { echo "❌ ERROR: src/index.html not found!"; exit 1; }
          
          echo "🔍 Checking for valid closing tags..."
          grep -q "</html>" src/index.html || { echo "❌ ERROR: Missing </html> tag!"; exit 1; }
          grep -q "</body>" src/index.html || { echo "❌ ERROR: Missing </body> tag!"; exit 1; }
          
          echo "✅ Validation passed! Ready for review."

  # 2. DEPLOYMENT JOB (Only runs on Push to Main or Manual Trigger)
  build-and-deploy:
    needs: validate # Waits for validation to pass first
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' # Only deploy on merge or manual run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src/'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
